# The display title of your workflow in the GitHub Actions tab
name: CI Test Suite

# Triggers that automatically start this workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A collection of automated tasks
jobs:
  validate-code:
    # Virtual machine OS provided by GitHub
    runs-on: ubuntu-24.04
    steps:
      # Clone your repository onto the runner
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Verify HTML File Exists
        run: |
          if [ -f "index.html" ]; then
            echo "SUCCESS: index.html found."
          else
            echo "ERROR: index.html is missing!" && exit 1
          fi

      - name: Basic Syntax & Structure Check
        run: |
          grep -iq "<html" index.html && echo "HTML validated." || (echo "Invalid HTML structure" && exit 1)
